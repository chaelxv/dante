<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0e4">
  <meta name="description" content="단테와 스텔라의 포근한 하루 — 직접 쓰다듬고, 씻기고, 요리하고, 옷을 골라 입히는 나만의 생활 게임">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=2.0.0">
  <title>단테와 스텔라의 포근한 하루</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brandHome" aria-label="집 화면으로 이동">
        <img src="assets/characters/outfits/racing.png" alt="">
        <span><strong>단테와 스텔라의</strong><em>포근한 하루</em></span><span class="brand-paw">♥</span>
      </button>
      <div class="time-pill"><span class="calendar-icon">☀</span><span id="timeDisplay">1일차 · 오전 08:30</span><small id="dayMood">오늘도 우리 함께</small></div>
      <div class="head-side"><div class="coin-pill"><span class="coin-icon">●</span><b id="coinDisplay">420</b><small>코인</small></div><span class="save-label" id="saveLabel">● 자동 저장</span></div>
    </header>
    <nav class="nav" aria-label="게임 메뉴">
      <button class="nav-btn active" data-view="home"><span>⌂</span>우리 집</button>
      <button class="nav-btn" data-view="closet"><span>♧</span>옷장</button>
      <button class="nav-btn" data-view="bath"><span>◌</span>목욕</button>
      <button class="nav-btn" data-view="sleep"><span>☾</span>재우기</button>
      <button class="nav-btn" data-view="cook"><span>♨</span>요리</button>
      <button class="nav-btn" data-view="feed"><span>♡</span>식사</button>
      <button class="nav-btn" data-view="shop"><span>◇</span>상점</button>
      <button class="nav-btn" data-view="diary"><span>✎</span>일기장</button>
      <button class="nav-btn" data-view="settings"><span>⚙</span>설정</button>
    </nav>
    <main id="app" tabindex="-1" aria-live="off"></main>
    <footer class="site-footer"><span>STELLA & DANTE · COZY LITTLE LIFE</span><span>배경음악 없는 조용한 생활 게임 · 자동 저장</span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="restoreFile" type="file" accept=".json,application/json" hidden>
  <script src="game.js?v=2.0.0" defer></script>
</body>
</html>
